services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    networks:
      - network
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    env_file:
      - ./.env
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u root -p$$(cat /run/secrets/db_root_password) -e 'SELECT 1' >/dev/null 2>&1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "9000:9000"
    networks:
      - network
    restart: always
    env_file:
      - ./.env
    secrets:
      - db_password
      - credentials
      - redis_password
    volumes:
      - wordpress_data:/var/www/html

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - network
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - ./.env

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - network
    restart: always
    env_file:
      - ./.env
    secrets:
      - db_root_password
      - db_password

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    networks:
      - network
    restart: always
    env_file:
      - ./.env
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    depends_on:
      - mariadb

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    networks:
      - network
    restart: always
    env_file:
      - ./.env
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    secrets:
      - ftp_credentials

  elasticsearch:
    build:
      context: ./requirements/bonus/elasticsearch
      dockerfile: Dockerfile
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - network
    restart: always
    env_file:
      - ./.env
    volumes:
      - elasticsearch_data:/var/lib/elasticsearch
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://nmatondo.42.fr:9200/_cluster/health || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

  myprofile:
    build:
      context: ./requirements/bonus/myprofile
      dockerfile: Dockerfile
    container_name: myprofile
    ports:
      - "8888:8888"
    networks:
      - network
    restart: always
    volumes:
      - myprofile_data:/var/www/myprofile
    env_file:
      - ./.env

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_credentials:
    file: ../secrets/ftp_credentials.txt

networks:
  network:

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmatondo/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmatondo/data/wordpress
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmatondo/data/redis
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmatondo/data/elasticsearch
  myprofile_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmatondo/data/myprofile
