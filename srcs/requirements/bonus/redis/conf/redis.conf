# Bind apenas na rede Docker (não expor externamente)
bind 0.0.0.0

# Porta padrão
port 6379

# Proteção: senha será injetada via entrypoint
requirepass REDIS_PASSWORD_PLACEHOLDER

# Modo protegido (apenas conexões locais sem senha)
protected-mode no

# Persistência de dados (opcional)
save 900 1
save 300 10
save 60 10000

# Diretório de dados
dir /data

# Log level
loglevel notice

# Desabilitar comandos perigosos (segurança)
rename-command FLUSHALL ""
rename-command CONFIG ""